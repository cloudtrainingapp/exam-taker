[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to the Render backend — X-Domain header is forwarded,
# so tenant resolution works exactly as it does via the Vite dev proxy.
[[redirects]]
  from   = "/api/*"
  to     = "https://api.quiz.microskill.ai/api/:splat"
  status = 200
  force  = true

# SPA catch-all — serve index.html for every non-asset path so
# React Router can handle client-side navigation.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
